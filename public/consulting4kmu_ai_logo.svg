<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="1200" height="480">
  <defs>
    <!-- Cyan Blue Gradient -->
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="60%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#0369A1" />
    </linearGradient>

    <!-- Tech Green Gradient -->
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A3E635" />
      <stop offset="60%" stop-color="#65A30D" />
      <stop offset="100%" stop-color="#4D7C0F" />
    </linearGradient>

    <!-- AI Data Bars Gradient -->
    <linearGradient id="barGrad1" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#CBD5E1" />
      <stop offset="100%" stop-color="#94A3B8" />
    </linearGradient>
    <linearGradient id="barGrad2" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#94A3B8" />
      <stop offset="100%" stop-color="#64748B" />
    </linearGradient>
    <linearGradient id="barGrad3" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#64748B" />
      <stop offset="100%" stop-color="#475569" />
    </linearGradient>

    <!-- Subtle Glow Filter -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- ================= EMBLEM "C" (Kompakter & perfekt austariert mit der Wortmarke) ================= -->
  <g transform="translate(45, 45)">
    <!-- Outer Blue Orbital Arc of the "C" -->
    <path d="M 195 50 A 118 118 0 1 0 195 230" fill="none" stroke="url(#blueGrad)" stroke-width="22" stroke-linecap="round" />
    
    <!-- Inner Green Tech/AI Arc -->
    <path d="M 168 66 A 94 94 0 1 0 168 214" fill="none" stroke="url(#greenGrad)" stroke-width="12" stroke-linecap="round" />

    <!-- AI Data / Analytics Bars inside the "C" -->
    <rect x="70" y="152" width="19" height="48" rx="4" fill="url(#barGrad1)" />
    <rect x="96" y="130" width="19" height="70" rx="4" fill="url(#barGrad2)" />
    <rect x="122" y="106" width="19" height="94" rx="4" fill="url(#barGrad3)" />

    <!-- AI Neural Network Nodes & Growth Arrow -->
    <line x1="80" y1="152" x2="106" y2="130" stroke="#0284C7" stroke-width="3.5" stroke-dasharray="2,2" />
    <line x1="106" y1="130" x2="132" y2="106" stroke="#0284C7" stroke-width="3.5" stroke-dasharray="2,2" />

    <circle cx="80" cy="152" r="5" fill="#38BDF8" stroke="#FFFFFF" stroke-width="2" />
    <circle cx="106" cy="130" r="5" fill="#38BDF8" stroke="#FFFFFF" stroke-width="2" />
    <circle cx="132" cy="106" r="5" fill="#38BDF8" stroke="#FFFFFF" stroke-width="2" />

    <!-- Dynamic AI Growth Arrow -->
    <polyline points="60,175 88,148 110,162 196,72" fill="none" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />
    <polyline points="60,175 88,148 110,162 196,72" fill="none" stroke="url(#blueGrad)" stroke-width="8.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#softGlow)" />
    
    <polygon points="204,64 170,72 186,88" fill="#0284C7" />
    <polygon points="204,64 175,75 185,85" fill="#38BDF8" />
  </g>

  <!-- ================= TYPOGRAPHY (Näher am C & größer skaliert -> Nahtlos "Consulting4KMU") ================= -->
  <g transform="translate(258, 178)">
    <text font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="98" letter-spacing="-1.5">
      <tspan font-weight="700" fill="#334155">onsulting</tspan>
      <tspan font-weight="900" fill="#0284C7">4</tspan>
      <tspan font-weight="800" fill="#0F172A">KMU</tspan>
    </text>
  </g>

  <!-- Sleek Dividing Line -->
  <line x1="60" y1="265" x2="1140" y2="265" stroke="#0F172A" stroke-width="2.5" stroke-linecap="round" />

  <!-- Subtitle (EXAKT ZENTRIERT): KI-AGENTUR FÜR DEN MITTELSTAND -->
  <g transform="translate(600, 315)">
    <text text-anchor="middle" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="34" font-weight="800" letter-spacing="6" fill="#0F172A">
      KI-AGENTUR F&#xDC;R DEN MITTELSTAND
    </text>
  </g>

  <!-- Category Keywords (EXAKT ZENTRIERT): PROZESSOPTIMIERUNG MITTELS KI | KI-BERATUNG & IMPLEMENTIERUNG -->
  <g transform="translate(600, 365)">
    <text text-anchor="middle" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="22" font-weight="700" letter-spacing="3" fill="#64748B">
      PROZESSOPTIMIERUNG MITTELS KI   |   KI-BERATUNG &amp; IMPLEMENTIERUNG
    </text>
  </g>
</svg>
