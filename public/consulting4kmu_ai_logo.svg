<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="1200" height="480">
  <defs>
    <!-- Cyan Blue Gradient -->
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="60%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#0369A1" />
    </linearGradient>

    <!-- Tech Green Gradient -->
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A3E635" />
      <stop offset="60%" stop-color="#65A30D" />
      <stop offset="100%" stop-color="#4D7C0F" />
    </linearGradient>

    <!-- AI Data Bars Gradient -->
    <linearGradient id="barGrad1" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#CBD5E1" />
      <stop offset="100%" stop-color="#94A3B8" />
    </linearGradient>
    <linearGradient id="barGrad2" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#94A3B8" />
      <stop offset="100%" stop-color="#64748B" />
    </linearGradient>
    <linearGradient id="barGrad3" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#64748B" />
      <stop offset="100%" stop-color="#475569" />
    </linearGradient>

    <!-- Subtle Glow Filter -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- ================= EMBLEM "C" MIT KI-NETZWERK & WACHSTUM (Left) ================= -->
  <g transform="translate(60, 40)">
    <!-- Outer Blue Orbital Arc of the "C" -->
    <path d="M 215 50 A 135 135 0 1 0 215 250" fill="none" stroke="url(#blueGrad)" stroke-width="24" stroke-linecap="round" />
    
    <!-- Inner Green Tech/AI Arc (Harmonische Doppel-Kurve wie im Original) -->
    <path d="M 185 68 A 108 108 0 1 0 185 232" fill="none" stroke="url(#greenGrad)" stroke-width="12" stroke-linecap="round" />

    <!-- AI Data / Analytics Bars inside the "C" -->
    <!-- Bar 1 -->
    <rect x="75" y="165" width="22" height="55" rx="5" fill="url(#barGrad1)" />
    <!-- Bar 2 -->
    <rect x="105" y="140" width="22" height="80" rx="5" fill="url(#barGrad2)" />
    <!-- Bar 3 -->
    <rect x="135" y="115" width="22" height="105" rx="5" fill="url(#barGrad3)" />

    <!-- AI Neural Network Nodes & Growth Arrow -->
    <!-- Connection Lines between bars & nodes -->
    <line x1="86" y1="165" x2="116" y2="140" stroke="#0284C7" stroke-width="4" stroke-dasharray="2,2" />
    <line x1="116" y1="140" x2="146" y2="115" stroke="#0284C7" stroke-width="4" stroke-dasharray="2,2" />

    <!-- AI Nodes (Pulse Dots) -->
    <circle cx="86" cy="165" r="5.5" fill="#38BDF8" stroke="#FFFFFF" stroke-width="2" />
    <circle cx="116" cy="140" r="5.5" fill="#38BDF8" stroke="#FFFFFF" stroke-width="2" />
    <circle cx="146" cy="115" r="5.5" fill="#38BDF8" stroke="#FFFFFF" stroke-width="2" />

    <!-- Dynamic AI Growth Arrow (Electric Blue / White Core) -->
    <!-- Main Arrow Shaft -->
    <polyline points="65,190 95,160 120,175 220,70" fill="none" stroke="#FFFFFF" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" />
    <polyline points="65,190 95,160 120,175 220,70" fill="none" stroke="url(#blueGrad)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" filter="url(#softGlow)" />
    
    <!-- Arrow Head -->
    <polygon points="228,62 188,72 208,92" fill="#0284C7" />
    <polygon points="228,62 194,76 206,88" fill="#38BDF8" />
  </g>

  <!-- ================= TYPOGRAPHY (Right) ================= -->
  <!-- "Consulting4KMU" -->
  <g transform="translate(305, 175)">
    <text font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="82" letter-spacing="-1">
      <tspan font-weight="700" fill="#334155">onsulting</tspan>
      <tspan font-weight="900" fill="#0284C7">4</tspan>
      <tspan font-weight="800" fill="#0F172A">KMU</tspan>
    </text>
  </g>

  <!-- Sleek Dividing Line -->
  <line x1="60" y1="265" x2="1140" y2="265" stroke="#0F172A" stroke-width="2.5" stroke-linecap="round" />

  <!-- Subtitle: KI-AGENTUR FÜR DEN MITTELSTAND -->
  <g transform="translate(60, 315)">
    <text font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="34" font-weight="800" letter-spacing="6" fill="#0F172A">
      KI-AGENTUR FÜR DEN MITTELSTAND
    </text>
  </g>

  <!-- Category Keywords: PROZESS-AUTOMATISIERUNG · KI-SYSTEME · DIGITALISIERUNG -->
  <g transform="translate(60, 365)">
    <text font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="22" font-weight="600" letter-spacing="3" fill="#64748B">
      PROZESS-AUTOMATISIERUNG  ▪  KI-SYSTEME  ▪  DIGITALE TRANSFORMATION
    </text>
  </g>
</svg>
