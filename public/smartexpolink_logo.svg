<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 280" width="960" height="280">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A0E1A" />
      <stop offset="50%" stop-color="#11182B" />
      <stop offset="100%" stop-color="#0A0E1A" />
    </linearGradient>

    <!-- Cyan Glow Gradient -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7DD3FC" />
      <stop offset="50%" stop-color="#00D4FF" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>

    <!-- Icon Container Gradient -->
    <linearGradient id="iconBoxGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#162238" />
      <stop offset="100%" stop-color="#0D1424" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="cyanGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Main Background -->
  <rect width="960" height="280" rx="28" fill="url(#bgGrad)" />
  <rect x="2" y="2" width="956" height="276" rx="26" fill="none" stroke="#00D4FF" stroke-opacity="0.18" stroke-width="2" />

  <!-- Subtle Background Grid Accent -->
  <circle cx="150" cy="140" r="110" fill="#00D4FF" fill-opacity="0.06" />
  <circle cx="520" cy="140" r="160" fill="#00D4FF" fill-opacity="0.03" />

  <!-- ================= ICON EMBLEM (Left) ================= -->
  <g transform="translate(56, 48)">
    <!-- Squircle Base -->
    <rect x="0" y="0" width="184" height="184" rx="42" fill="url(#iconBoxGrad)" stroke="#00D4FF" stroke-opacity="0.45" stroke-width="2.5" />

    <!-- Smart Scan Reticle Corners (White/Ice-Blue) -->
    <path d="M 32 58 L 32 38 Q 32 32 38 32 L 58 32" fill="none" stroke="#7DD3FC" stroke-width="5" stroke-linecap="round" />
    <path d="M 126 32 L 146 32 Q 152 32 152 38 L 152 58" fill="none" stroke="#7DD3FC" stroke-width="5" stroke-linecap="round" />
    <path d="M 32 126 L 32 146 Q 32 152 38 152 L 58 152" fill="none" stroke="#7DD3FC" stroke-width="5" stroke-linecap="round" />
    <path d="M 126 152 L 146 152 Q 152 152 152 146 L 152 126" fill="none" stroke="#7DD3FC" stroke-width="5" stroke-linecap="round" />

    <!-- Interlocking Link & Expo Globe/Node -->
    <!-- Left Link Loop (White) -->
    <path d="M 85 72 L 68 72 A 20 20 0 0 0 68 112 L 85 112" fill="none" stroke="#FFFFFF" stroke-width="10" stroke-linecap="round" />
    <!-- Right Link Loop (Glowing Cyan) -->
    <path d="M 99 72 L 116 72 A 20 20 0 0 1 116 112 L 99 112" fill="none" stroke="url(#cyanGrad)" stroke-width="10" stroke-linecap="round" filter="url(#cyanGlow)" />
    <!-- Center Bridge / Connection Bar -->
    <line x1="74" y1="92" x2="110" y2="92" stroke="#00D4FF" stroke-width="8" stroke-linecap="round" />

    <!-- Connection Pulse Dots -->
    <circle cx="64" cy="92" r="5" fill="#FFFFFF" />
    <circle cx="120" cy="92" r="5" fill="#00D4FF" />
  </g>

  <!-- ================= WORDMARK (Right) ================= -->
  <!-- CamelCase Wordmark: Smart (White) + Expo (Ice-Blue #00D4FF) + Link (White) -->
  <g transform="translate(276, 152)">
    <text font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="78" font-weight="800" letter-spacing="-1.5">
      <tspan fill="#FFFFFF">Smart</tspan><tspan fill="#00D4FF">Expo</tspan><tspan fill="#FFFFFF">Link</tspan>
    </text>

    <!-- Subtitle & Domain Badge -->
    <text x="4" y="44" font-family="'Segoe UI', 'Inter', Arial, sans-serif" font-size="18" font-weight="600" fill="#8A99AD" letter-spacing="3.5">
      INTELLIGENT TRADE FAIR &amp; CRM BRIDGE
    </text>

    <!-- Domain Pill -->
    <g transform="translate(4, 62)">
      <rect x="0" y="0" width="215" height="28" rx="14" fill="#00D4FF" fill-opacity="0.12" stroke="#00D4FF" stroke-opacity="0.35" stroke-width="1" />
      <circle cx="16" cy="14" r="4" fill="#00FF88" />
      <text x="28" y="19" font-family="'Consolas', 'DM Mono', monospace" font-size="13" font-weight="700" fill="#7DD3FC">
        smartexpolink.com
      </text>
    </g>
  </g>
</svg>
