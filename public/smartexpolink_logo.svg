<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 480" width="1600" height="480">
  <defs>
    <!-- Cyan Glow Filter -->
    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Linear Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A0E1A" />
      <stop offset="50%" stop-color="#121A2E" />
      <stop offset="100%" stop-color="#0A0E1A" />
    </linearGradient>

    <linearGradient id="iconBoxGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#18243C" />
      <stop offset="100%" stop-color="#0E1626" />
    </linearGradient>

    <linearGradient id="iceGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7DD3FC" />
      <stop offset="50%" stop-color="#00D4FF" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
  </defs>

  <!-- Background Container -->
  <rect width="1600" height="480" rx="36" fill="url(#bgGrad)" stroke="#00D4FF" stroke-opacity="0.22" stroke-width="3" />

  <!-- Ambient Glow Behind Icon -->
  <circle cx="230" cy="240" r="170" fill="#00D4FF" fill-opacity="0.12" filter="url(#cyanGlow)" />

  <!-- ================= ICON SQUIRCLE ================= -->
  <g transform="translate(80, 90)">
    <!-- Base Squircle -->
    <rect x="0" y="0" width="300" height="300" rx="84" fill="url(#iconBoxGrad)" stroke="#00D4FF" stroke-width="5" />

    <!-- 4 Scanner Reticle Corners -->
    <path d="M 45 90 L 45 45 L 90 45" fill="none" stroke="#7DD3FC" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 210 45 L 255 45 L 255 90" fill="none" stroke="#7DD3FC" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 45 210 L 45 255 L 90 255" fill="none" stroke="#7DD3FC" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 210 255 L 255 255 L 255 210" fill="none" stroke="#7DD3FC" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Central Link & Beam -->
    <line x1="106" y1="150" x2="194" y2="150" stroke="#00D4FF" stroke-width="12" stroke-linecap="round" />
    
    <!-- Left Node (White) -->
    <circle cx="106" cy="150" r="28" fill="none" stroke="#FFFFFF" stroke-width="12" />
    <circle cx="106" cy="150" r="9" fill="#FFFFFF" />

    <!-- Right Node (Ice-Blue Glow) -->
    <circle cx="194" cy="150" r="28" fill="none" stroke="#00D4FF" stroke-width="12" filter="url(#cyanGlow)" />
    <circle cx="194" cy="150" r="9" fill="#00D4FF" />
  </g>

  <!-- ================= TYPOGRAPHY (CamelCase: Smart + Expo + Link) ================= -->
  <g transform="translate(440, 240)">
    <text font-family="'Syne', 'Inter', 'Segoe UI', system-ui, sans-serif" font-weight="800" font-size="132" letter-spacing="-2">
      <tspan fill="#FFFFFF">Smart</tspan><tspan fill="#00D4FF" filter="url(#cyanGlow)">Expo</tspan><tspan fill="#FFFFFF">Link</tspan>
    </text>
    
    <text y="70" x="6" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-weight="700" font-size="28" letter-spacing="4" fill="#7DD3FC" fill-opacity="0.9">
      AI TRADE FAIR LEAD CAPTURE &amp; SOURCING PLATFORM
    </text>
  </g>
</svg>
